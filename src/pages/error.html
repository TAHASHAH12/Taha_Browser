<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Can’t open page</title>
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main class="error-page">
    <h1>This page can’t be reached</h1>
    <p id="message"></p>
    <p class="error-code" id="code"></p>
    <button class="button primary" id="retry">Try again</button>
  </main>
  <script src="error.js"></script>
</body>
</html>
