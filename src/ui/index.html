<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: http:">
  <title>Taha</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="chrome">
    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="new-tab" title="New tab">
        <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>

    <div id="toolbar">
      <button id="back" class="icon-btn" title="Back" disabled>
        <svg viewBox="0 0 16 16"><path d="M13 8H3m4.5-4.5L3 8l4.5 4.5"/></svg>
      </button>
      <button id="forward" class="icon-btn" title="Forward" disabled>
        <svg viewBox="0 0 16 16"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5"/></svg>
      </button>
      <button id="reload" class="icon-btn" title="Reload"></button>

      <div id="omnibox">
        <span id="site-icon"></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
        <button id="star" class="icon-btn small" title="Bookmark this page" hidden>
          <svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
        </button>
      </div>

      <span id="private-badge" hidden>Private</span>
      <button id="downloads" class="icon-btn" title="Downloads" hidden>
        <svg viewBox="0 0 16 16"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13.5h10"/></svg>
        <span class="dot" hidden></span>
      </button>
      <button id="menu" class="icon-btn" title="Menu">
        <svg viewBox="0 0 16 16" class="filled"><circle cx="8" cy="3" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="8" cy="13" r="1.3"/></svg>
      </button>
    </div>

    <div id="bookmarks-bar" hidden></div>

    <div id="findbar" hidden>
      <input id="find-input" type="text" spellcheck="false" autocomplete="off" placeholder="Find in page">
      <span id="find-count"></span>
      <button id="find-prev" class="icon-btn small" title="Previous match">
        <svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
      </button>
      <button id="find-next" class="icon-btn small" title="Next match">
        <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <button id="find-close" class="icon-btn small" title="Close">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
  </div>

  <div id="suggestions" hidden></div>

  <script src="ui.js"></script>
</body>
</html>
